<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title><span class="thj">当前累计用餐人数</span></title>
  <style>
    :root {
        /*--bg: url('./image/bag.png');*/
        --accent: #FFD166;
        --text: #FFFFFF;
    }

    html, body {
        height: 100%;
        margin: 0;
        font-family: "Microsoft Yahei", sans-serif;
        background: #f5f7fb;
    }

    .top-banner {
        height: 100vh;
        width: 100%;
        /*background-image: var(--bg);*/
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        /*color: var(--text);*/
    }

    .top-banner::before {
        content: "";
        position: absolute;
        inset: 0;
        /*background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.45));*/
    }

    .banner-content {
        position: relative;
        z-index: 2;
        display: flex; /* 让元素在一行显示 */
        flex-direction: row; /* 横向排列 */
        align-items: center; /* 垂直居中对齐 */
        justify-content: center; /* 水平居中对齐 */
        gap: 10px; /* 给标题和数字之间加间隔 */
    }

    .title {
        font-size: 3.5rem;
        margin: 0; /* 去掉标题和数字之间的额外间距 */
    }

    .count-number {
        font-size: 4.2rem;
        font-weight: 700;
        /*color: var(--accent);*/
        margin: 0; /* 去掉数字的额外间距 */
    }

    @media (max-width: 600px) {
        .title { font-size: 2rem; }
        .count-number { font-size: 3rem; }
    }
</style>
</head>
<body>
  <!-- 顶部 banner：占视口上部三分之一 -->
  <header class="top-banner" id="topBanner">
    <div class="banner-content">
      <h1 class="title">当前累计用餐人数：</h1>

      <!-- data-count：放最终的累计人数（可以在 JS 中读取并做动画/更新） -->
      <div class="count-card" aria-live="polite">
        <p id="countNumber" class="count-number" data-count="12345">0</p>
        <!-- <div class="count-label">人</div> -->
      </div>
    </div>
  </header>

  

  <script>
    /**
     * 小功能：读取 data-count 并做一个从 0 -> target 的动画
     * 如果你想从接口获取实时数据，请替换 fetchCurrentCount() 中的模拟逻辑。
     */
    (function(){
      const el = document.getElementById('countNumber');

      // 你可以把目标值写在 data-count，也可以通过接口替换：
      let target = parseInt(el.getAttribute('data-count') || '0', 10);

      // 如果需要从后端拉取最新值，取消注释并实现 fetchCurrentCount()
      // fetchCurrentCount().then(v => { target = v; el.setAttribute('data-count', v); animateCount(0, v); });

      animateCount(0, target, 1500);

      /**
       * 动画函数：从 start -> end，用 duration 毫秒
       */
      function animateCount(start, end, duration = 1000) {
        if (end === start) {
          el.textContent = String(end);
          return;
        }
        const startTime = performance.now();
        const step = (now) => {
          const t = Math.min(1, (now - startTime) / duration);
          // easeOutCubic
          const eased = 1 - Math.pow(1 - t, 3);
          const current = Math.floor(start + (end - start) * eased);
          el.textContent = current.toLocaleString(); // 加上千分位
          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            el.textContent = end.toLocaleString();
          }
        };
        requestAnimationFrame(step);
      }

      // 示例：异步从后端获取当前人数（请自行实现真实的 API）
      async function fetchCurrentCount(){
        // 示例：假装从 /api/count 拉取
        // const res = await fetch('/api/count');
        // const data = await res.json();
        // return data.count;

        // 目前返回模拟值
        return new Promise(resolve => setTimeout(() => resolve(98765), 600));
      }

      // 如果你想自动刷新（比如每 30s 更新一次），可以启用下列代码：
      // setInterval(async () => {
      //   const newVal = await fetchCurrentCount();
      //   animateCount(parseInt(el.textContent.replace(/,/g,'')), newVal, 800);
      // }, 30000);

    })();
  </script>
</body>
</html>
