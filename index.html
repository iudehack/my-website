<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title><span class="thj">当前累计用餐人数</span></title>
  <style>
    :root{
      /* 替换下面的 URL 为你的背景图地址（可以是本地相对路径或线上 URL） */
      --bg: url('./bag.png');
      --overlay: rgba(0,0,0,0.35);
      --accent: #FFD166;
      --text: #FFFFFF;
    }

    html,body{
      height:100%;
      margin:0;
      font-family: "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft Yahei", sans-serif;
      background:#f5f7fb;
    }


    /* 顶部区域：占视口高度的三分之一 */
    .top-banner {
      height: calc(100vh / 1); /* 或者 33.333vh */
      width:100%;
      background-image: var(--bg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      overflow: hidden;
    }

    /* 遮罩层，让文字在复杂背景上更清晰 */
    .top-banner::before{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.45));
      mix-blend-mode: multiply;
      pointer-events:none;
    }

    .banner-content{
      position: relative; /* 高于遮罩 */
      text-align:center;
      z-index:2;
      padding: 12px 20px;
      width:100%;
      max-width:1200px;

      /* ✅ 新增 */
  display: flex;
  flex-direction: column;
  align-items: center;
    }

    .title {
      font-size: 3.5rem;
      letter-spacing: 1px;
      margin:70px 0 8px 0;
      opacity: 0.95;
    }


    .count-card {
      display: inline-block;
      /* background: rgba(255,255,255,0.08); */
      padding: 18px 28px;
      border-radius: 12px;
      min-width: 240px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      /* margin-top: 40px; 标题和卡片之间的间距 */
    }

    .count-number {
      font-size: 4.8rem;
      font-weight: 700;
      color: var(--accent);
      margin:0;
      line-height:1;
    }

    .count-label {
      font-size: 4.92rem;
      color: rgba(255,255,255,0.9);
      margin-top:6px;
    }

    /* 响应式调整 */
    @media (max-width:600px){
      .title { font-size:1.15rem; }
      .count-number { font-size:2rem; }
      .count-card { padding: 12px 16px; min-width: 180px; }
    }

    /* 页面其他占位，方便预览滚动效果 */
    main {
      padding: 24px;
    }
  </style>
</head>
<body>
  <!-- 顶部 banner：占视口上部三分之一 -->
  <header class="top-banner" id="topBanner">
    <div class="banner-content">
      <h1 class="title">当前累计用餐人数</h1>

      <!-- data-count：放最终的累计人数（可以在 JS 中读取并做动画/更新） -->
      <div class="count-card" aria-live="polite">
        <p id="countNumber" class="count-number" data-count="12345">0</p>
        <!-- <div class="count-label">人</div> -->
      </div>
    </div>
  </header>

  

  <script>
    /**
     * 小功能：读取 data-count 并做一个从 0 -> target 的动画
     * 如果你想从接口获取实时数据，请替换 fetchCurrentCount() 中的模拟逻辑。
     */
    (function(){
      const el = document.getElementById('countNumber');

      // 你可以把目标值写在 data-count，也可以通过接口替换：
      let target = parseInt(el.getAttribute('data-count') || '0', 10);

      // 如果需要从后端拉取最新值，取消注释并实现 fetchCurrentCount()
      // fetchCurrentCount().then(v => { target = v; el.setAttribute('data-count', v); animateCount(0, v); });

      animateCount(0, target, 1500);

      /**
       * 动画函数：从 start -> end，用 duration 毫秒
       */
      function animateCount(start, end, duration = 1000) {
        if (end === start) {
          el.textContent = String(end);
          return;
        }
        const startTime = performance.now();
        const step = (now) => {
          const t = Math.min(1, (now - startTime) / duration);
          // easeOutCubic
          const eased = 1 - Math.pow(1 - t, 3);
          const current = Math.floor(start + (end - start) * eased);
          el.textContent = current.toLocaleString(); // 加上千分位
          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            el.textContent = end.toLocaleString();
          }
        };
        requestAnimationFrame(step);
      }

      // 示例：异步从后端获取当前人数（请自行实现真实的 API）
      async function fetchCurrentCount(){
        // 示例：假装从 /api/count 拉取
        // const res = await fetch('/api/count');
        // const data = await res.json();
        // return data.count;

        // 目前返回模拟值
        return new Promise(resolve => setTimeout(() => resolve(98765), 600));
      }

      // 如果你想自动刷新（比如每 30s 更新一次），可以启用下列代码：
      // setInterval(async () => {
      //   const newVal = await fetchCurrentCount();
      //   animateCount(parseInt(el.textContent.replace(/,/g,'')), newVal, 800);
      // }, 30000);

    })();
  </script>
</body>
</html>
